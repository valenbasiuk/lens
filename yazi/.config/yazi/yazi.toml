# =============================================================================
# lens - yazi.toml
# file manager configuration
# =============================================================================

[manager]
ratio         = [1, 3, 4]
sort_by       = "natural"
sort_sensitive = false
sort_reverse  = false
sort_dir_first = true
show_hidden   = false
show_symlink  = true

[preview]
tab_size   = 2
max_width  = 600
max_height = 900
image_filter = "triangle"
image_quality = 75

[opener]
edit = [
    { run = '$EDITOR "$@"', block = true, for = "unix" }
]
open = [
    { run = 'xdg-open "$@"', for = "unix" }
]

[tasks]
micro_workers = 5
macro_workers = 10
bizarre_retry = 5
