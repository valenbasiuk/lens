# =============================================================================
# lens - hyprland.conf
# frutiger aero aesthetic
#
# glosary:
# line  21  = monitor
# line  24  = nvidia env vars
# line  34  = wayland env vars
# line  46  = cursor
# line  51  = autostart
# line  63  = input (keyboard layout, mouse, sensitivity)
# line  74  = general (gaps, borders, layout)
# line  88  = decoration (blur, rounding, shadows, opacity)
# line 120  = animations
# line 140  = layout (dwindle, master)
# line 151  = misc
# line 160  = window rules
# line 191  = source keybinds.conf
# =============================================================================

# --- monitor ---
# DP-2     = ASUS VG248, 165Hz   -> main (left, position 0x0)
# HDMI-A-1 = Samsung C24F390, 60Hz -> secondary (right, position 1920x0)
monitor = DP-2,     1920x1080@164.92, 0x0,    1
monitor = HDMI-A-1, 1920x1080@60,    1920x0,  1


# --- nvidia ---
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm    # remove this line if you get a black screen
env = NVD_BACKEND,direct

# workaround for nvidia flickering
env = __GL_GSYNC_ALLOWED,0
env = __GL_VRR_ALLOWED,0

# --- wayland env ---
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt5ct
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = MOZ_ENABLE_WAYLAND,1

# --- cursor ---
cursor {
    no_hardware_cursors = true
}

# --- autostart ---
exec-once = waybar
exec-once = hyprpaper
exec-once = swaync
exec-once = hypridle
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# create screenshots dir + make lensctl executable
exec-once = mkdir -p $(xdg-user-dir PICTURES)/screenshots
exec-once = chmod +x ~/.config/hypr/scripts/lensctl

# --- input ---
input {
    kb_layout = latam
    numlock_by_default = true
    repeat_delay = 150
    repeat_rate = 70

    sensitivity = -0.94
    accel_profile = flat      # required: without flat, -0.94 applies to accel curve (wrong feel)

    follow_mouse = 1
    off_window_axis_events = 2

    touchpad {
        natural_scroll = true
        disable_while_typing = true
        clickfinger_behavior = true
        scroll_factor = 0.7
    }
}

# --- general ---
general {
    gaps_in = 5
    gaps_out = 8
    border_size = 1

    # static aero gradient: cyan to emerald green (crisp glass cut, no loop animation)
    col.active_border = rgba(00bcd4ff) rgba(7ed957ff) 45deg
    col.inactive_border = rgba(ffffff22)

    layout = dwindle
    allow_tearing = false
    resize_on_border = true
}

# --- decoration (frutiger aero glass core) ---
decoration {
    rounding = 16

    # glass opacity
    active_opacity = 0.93
    inactive_opacity = 0.88

    # clean glass elevation shadow (nostalgic aero, not bright neon glow)
    shadow {
        enabled = true
        range = 20
        render_power = 4
        color = rgba(00000040)
        color_inactive = rgba(00000020)
    }

    # glass blur
    blur {
        enabled = true
        size = 10
        passes = 3
        noise = 0.03
        contrast = 0.89
        brightness = 1.0
        vibrancy = 0.5
        vibrancy_darkness = 0.4
        new_optimizations = true
        xray = true
    }
}

# --- animations ---
animations {
    enabled = true

    # fluid aero curves
    bezier = aero, 0.25, 1, 0.5, 1
    bezier = aeroSlow, 0.36, 0, 0.66, -0.56
    bezier = aeroSmooth, 0.4, 0, 0.2, 1

    animation = windows, 1, 5, aero, popin 85%
    animation = windowsIn, 1, 5, aero, popin 85%
    animation = windowsOut, 1, 4, aero, popin 90%
    animation = windowsMove, 1, 4, aeroSmooth
    animation = border, 1, 5, aero
    animation = fade, 1, 4, aero
    animation = workspaces, 1, 5, aeroSmooth, slide
    animation = layers, 1, 4, aero, fade
}

# --- layout ---
dwindle {
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

# --- misc ---
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 0
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    focus_on_activate = true
    allow_session_lock_restore = true
}

# =============================================================================
# WINDOW RULES
# =============================================================================

# float common dialogs
windowrule = float class:^(pavucontrol)$
windowrule = float class:^(blueman-manager)$
windowrule = float class:^(nm-connection-editor)$
windowrule = float class:^(nwg-look)$
windowrule = float class:^(qt5ct)$
windowrule = float class:^(qt6ct)$
windowrule = float class:^(file-roller)$
windowrule = float title:^(Open File)$
windowrule = float title:^(Save As)$
windowrule = float class:^(xdg-desktop-portal-gtk)$

# dolphin dialogs
windowrule = float class:^(dolphin)$ title:^(Copying)$
windowrule = float class:^(dolphin)$ title:^(Moving)$
windowrule = float class:^(dolphin)$ title:^(Deleting)$

# polkit
windowrule = float class:^(polkit-gnome-authentication-agent-1)$

# picture in picture
windowrule = float title:^(Picture-in-Picture)$
windowrule = pin title:^(Picture-in-Picture)$
windowrule = size 480 270 title:^(Picture-in-Picture)$

# =============================================================================
# KEYBINDS (separate file)
# =============================================================================
source = ~/.config/hypr/keybinds.conf
