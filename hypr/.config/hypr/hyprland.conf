# ========
#  Hyprland config file for my "diinki aero" rice.
# ========

#                    !!MONITORS!!                    #
# --------------------------------------------------------------------------------- #
# Configuración basada en `hyprctl monitors`
monitor = DP-1, 1920x1080@144.00, 0x0, 1
# Si tienes un segundo monitor (ej. DP-3), descomenta y ajusta la línea de abajo:
# monitor = DP-3, 2560x1440@164.84, 1920x0, 1


# Startup programs
exec-once = nm-applet
exec-once = hyprpaper
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = waybar
exec = $HOME/.config/eww/scripts/start.sh


# Default programs
$terminal = kitty
$fileManager = caja
$menu = wofi --show drun


# Environment variables
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# ~/.config/hypr/hyprland.conf

env = MOZ_ENABLE_WAYLAND,1
env = NVD_BACKEND,direct  # Solo si usas NVIDIA


#                    !!INPUT!!                       #
# --------------------------------------------------------------------------------- #
input {
    kb_layout = us,se
    kb_options = grp:alt_shift_toggle

    kb_rules = 
    kb_variant =
    kb_model =

    follow_mouse = 1

    # Tu sensibilidad ajustada a la que tenías en KDE Plasma (-0.94)
    sensitivity = -0.94 

    touchpad {
        natural_scroll = false
    }
}

cursor {
    no_hardware_cursors = true
}


#                    !!DESIGN!!                      #
# --------------------------------------------------------------------------------- #
animations {
    enabled = true

    bezier = myBezier, 0, 1, 0.18, 1.0

    animation = windows, 1, 1.5, myBezier
    animation = windowsOut, 1, 2, myBezier, popin 95%
    animation = border, 1, 12, myBezier
    animation = borderangle, 1, 5, default
    animation = fade, 1, 6, default
    animation = workspaces, 1, 6, default
}

general {
    gaps_in = 5
    gaps_out = 10

    border_size = 1

    col.active_border = rgb(18,18,18)
    col.inactive_border = rgb(18,18,18)

    resize_on_border = true

    layout = dwindle

    allow_tearing = false
}

decoration {
    rounding = 12

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow:enabled = true
    shadow:range = 16
    shadow:render_power = 5
    shadow:color = rgba(0,0,0,0.35)

    blur:enabled = true
    blur:new_optimizations = true
    blur:size = 2
    blur:passes = 3
    blur:vibrancy = 0.1696
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

gestures {
    workspace_swipe = false
}


#                    !!KEYBINDS!!                    #
# --------------------------------------------------------------------------------- #
$mainMod = SUPER

bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, S, exec, hyprshot --mode region --output-folder /tmp
bind = $mainMod, E, exec, $fileManager
bind = $mainMod SHIFT, SPACE, togglefloating
bind = $mainMod, F, fullscreen
bind = $mainMod, D, exec, $menu

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-


#                    !!WINDOW RULES!!                #
# --------------------------------------------------------------------------------- #
layerrule = blur, wofi 
layerrule = ignorealpha 0.01, wofi

layerrule = blur, waybar
layerrule = blurpopups, waybar
layerrule = ignorealpha 0.01, waybar

layerrule = blur, eww
layerrule = blurpopups, eww
layerrule = ignorealpha 0.01, eww

windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
