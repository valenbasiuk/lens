# =============================================================================
# lens — keybinds.conf
# based on end-4 dots, adapted for lens stack (no quickshell)
#
# glosary:
# line  16  = apps (terminal, file manager, launcher, etc.)
# line  34  = screenshots + color picker
# line  52  = clipboard + emoji
# line  58  = notifications
# line  62  = window management (close, float, fullscreen, pin)
# line  80  = focus (arrows + vim HJKL)
# line  96  = move windows
# line 106  = resize
# line 116  = split ratio
# line 121  = workspaces 1-10 (switch)
# line 135  = workspaces 1-10 (move window to)
# line 149  = workspace scroll + page up/down
# line 163  = scratchpad
# line 169  = mouse binds (drag move, drag resize, scroll ws)
# line 178  = media keys
# line 198  = volume + mic mute
# line 213  = brightness
# line 218  = session (lock, suspend, power off)
# =============================================================================

$mod = SUPER

# =============================================================================
# APPS
# =============================================================================

bind = $mod, RETURN, exec, kitty
bind = $mod, T, exec, kitty
bind = CTRL ALT, T, exec, kitty
bind = $mod, E, exec, thunar
bind = $mod, D, exec, rofi -show drun
bind = CTRL $mod, V, exec, pavucontrol
bind = CTRL SHIFT, Escape, exec, kitty -e btop

# =============================================================================
# SCREENSHOTS + COLOR PICKER
# =============================================================================

# region screenshot to clipboard
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy && notify-send "screenshot" "region copied to clipboard"

# region screenshot to editor
bind = $mod SHIFT ALT, S, exec, grim -g "$(slurp)" - | swappy -f -

# fullscreen screenshot to clipboard
bind = , Print, exec, grim - | wl-copy && notify-send "screenshot" "copied to clipboard"

# fullscreen screenshot to file + clipboard
bind = CTRL, Print, exec, mkdir -p $(xdg-user-dir PICTURES)/screenshots && grim $(xdg-user-dir PICTURES)/screenshots/$(date '+%Y%m%d_%H%M%S').png && grim - | wl-copy && notify-send "screenshot" "saved to file and clipboard"

# color picker
bind = $mod SHIFT, C, exec, hyprpicker -a && notify-send "color picker" "color copied to clipboard"

# =============================================================================
# CLIPBOARD + EMOJI
# =============================================================================

bind = $mod, V, exec, cliphist list | rofi -dmenu -p "clipboard" | cliphist decode | wl-copy
bind = $mod, PERIOD, exec, rofi -show emoji -emoji-format "{emoji}" -modi emoji

# =============================================================================
# NOTIFICATIONS
# =============================================================================

bind = $mod, N, exec, swaync-client -t -sw

# =============================================================================
# WINDOW MANAGEMENT
# =============================================================================

# close
bind = $mod, Q, killactive,

# alt+f4 warning (end-4 style)
bind = ALT, F4, exec, notify-send "wrong close keybind" "use Super+Q to close. Alt+F4 is for Windows VMs" -a "Hyprland"
bind = ALT, F4, killactive,

# force kill (click on window to zap)
bind = $mod SHIFT ALT, Q, exec, hyprctl kill

# float / tile toggle
bind = $mod ALT, SPACE, togglefloating,

# maximize (keep gaps + bar)
bind = $mod, D, fullscreen, 1

# fullscreen (no gaps, covers bar)
bind = $mod, F, fullscreen, 0

# pin (stays on all workspaces)
bind = $mod, P, pin,

# pseudo tiling
bind = $mod, J, pseudo,

# toggle split direction
bind = $mod, S, togglesplit,

# =============================================================================
# FOCUS — arrows + vim HJKL
# =============================================================================

bind = $mod, LEFT, movefocus, l
bind = $mod, RIGHT, movefocus, r
bind = $mod, UP, movefocus, u
bind = $mod, DOWN, movefocus, d

# vim style (secondary)
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
# note: $mod+J is pseudo above, uncomment if you prefer vim focus over pseudo
# bind = $mod, J, movefocus, d

# =============================================================================
# MOVE WINDOWS
# =============================================================================

bind = $mod SHIFT, LEFT, movewindow, l
bind = $mod SHIFT, RIGHT, movewindow, r
bind = $mod SHIFT, UP, movewindow, u
bind = $mod SHIFT, DOWN, movewindow, d

bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d

# =============================================================================
# RESIZE
# =============================================================================

binde = $mod CTRL, LEFT, resizeactive, -40 0
binde = $mod CTRL, RIGHT, resizeactive, 40 0
binde = $mod CTRL, UP, resizeactive, 0 -40
binde = $mod CTRL, DOWN, resizeactive, 0 40

binde = $mod CTRL, H, resizeactive, -40 0
binde = $mod CTRL, L, resizeactive, 40 0
binde = $mod CTRL, K, resizeactive, 0 -40
binde = $mod CTRL, J, resizeactive, 0 40

# =============================================================================
# SPLIT RATIO (end-4 style: semicolon/apostrophe)
# =============================================================================

binde = $mod, SEMICOLON, splitratio, -0.1
binde = $mod, APOSTROPHE, splitratio, +0.1

# =============================================================================
# WORKSPACES — switch
# =============================================================================

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# =============================================================================
# WORKSPACES — move window to (follows focus, end-4 uses silent)
# =============================================================================

# move and follow
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# move silently (end-4 style: Super+Alt+N)
bind = $mod ALT, 1, movetoworkspacesilent, 1
bind = $mod ALT, 2, movetoworkspacesilent, 2
bind = $mod ALT, 3, movetoworkspacesilent, 3
bind = $mod ALT, 4, movetoworkspacesilent, 4
bind = $mod ALT, 5, movetoworkspacesilent, 5
bind = $mod ALT, 6, movetoworkspacesilent, 6
bind = $mod ALT, 7, movetoworkspacesilent, 7
bind = $mod ALT, 8, movetoworkspacesilent, 8
bind = $mod ALT, 9, movetoworkspacesilent, 9
bind = $mod ALT, 0, movetoworkspacesilent, 10

# =============================================================================
# WORKSPACES — scroll + page up/down
# =============================================================================

# scroll through workspaces
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# page up/down
bind = $mod, PAGE_DOWN, workspace, r+1
bind = $mod, PAGE_UP, workspace, r-1

# ctrl+super+arrows (end-4 style)
bind = CTRL $mod, RIGHT, workspace, r+1
bind = CTRL $mod, LEFT, workspace, r-1

# move window with scroll
bind = $mod SHIFT, mouse_down, movetoworkspace, r+1
bind = $mod SHIFT, mouse_up, movetoworkspace, r-1

# =============================================================================
# SCRATCHPAD (special workspace)
# =============================================================================

bind = $mod, grave, togglespecialworkspace, special
bind = $mod ALT, S, movetoworkspace, special:special

# =============================================================================
# MOUSE BINDS
# =============================================================================

# drag to move/resize
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# =============================================================================
# MEDIA KEYS
# =============================================================================

# play / pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = $mod SHIFT, P, exec, playerctl play-pause

# next / prev
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = $mod SHIFT, N, exec, playerctl next
bindl = $mod SHIFT, B, exec, playerctl previous

# =============================================================================
# VOLUME + MIC
# =============================================================================

# volume
bindel = , XF86AudioRaiseVolume, exec, pamixer -i 2
bindel = , XF86AudioLowerVolume, exec, pamixer -d 2

# mute
bindl = , XF86AudioMute, exec, pamixer -t
bindl = $mod SHIFT, M, exec, pamixer -t

# mic mute
bindl = , XF86AudioMicMute, exec, pamixer --default-source -t
bindl = $mod ALT, M, exec, pamixer --default-source -t

# =============================================================================
# BRIGHTNESS
# =============================================================================

bindel = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# =============================================================================
# SESSION
# =============================================================================

# lock
bind = $mod, BACKSPACE, exec, hyprlock
bind = $mod, L, exec, loginctl lock-session

# suspend
bind = $mod SHIFT, L, exec, systemctl suspend || loginctl suspend

# power off (intentionally hard to press)
bind = CTRL SHIFT ALT $mod, DELETE, exec, systemctl poweroff

# exit hyprland
bind = $mod SHIFT, Q, exit,
