# =============================================================================
# lens — hyprpaper.conf
# drop a .jpg/.png into ~/Pictures/wallpapers/ and set it here
# or use lensctl (SUPER+COMMA) > wallpaper to pick one live
# =============================================================================

splash = false
ipc = on

# --- wallpaper ---
# uncomment and set a path once you have a wallpaper:
# preload = ~/Pictures/wallpapers/your-wallpaper.jpg
# wallpaper = ,~/Pictures/wallpapers/your-wallpaper.jpg

# tip: if you leave this blank, hyprpaper starts with a black background.
# use lensctl > wallpaper to pick one without editing this file.
