# =============================================================================
# lens — kitty.conf
# frutiger aero terminal
# =============================================================================

# --- font ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# --- cursor ---
cursor_shape          beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5

# --- window ---
window_padding_width  12
placement_strategy    center
hide_window_decorations yes
confirm_os_window_close 0

# --- transparency (glass effect) ---
background_opacity 0.85
dynamic_background_opacity yes

# --- scrollback ---
scrollback_lines 10000

# --- urls ---
detect_urls yes
url_style   curly

# --- tab bar ---
tab_bar_edge        bottom
tab_bar_style       powerline
tab_powerline_style slanted
tab_bar_min_tabs    2

active_tab_foreground   #003d47
active_tab_background   #00bcd4
active_tab_font_style   bold
inactive_tab_foreground #80cbc4
inactive_tab_background #004d59

# --- bell ---
enable_audio_bell no
visual_bell_duration 0

# =============================================================================
# FRUTIGER AERO COLOR SCHEME
# teal/cyan palette with soft contrast
# =============================================================================

# default colors
foreground #e0f7fa
background #002b36

# selection
selection_foreground  #002b36
selection_background  #00bcd4

# cursor
cursor            #00bcd4
cursor_text_color #002b36

# black (dark base)
color0  #003340
color8  #00566b

# red (warm accent, muted)
color1  #e57373
color9  #ef9a9a

# green (nature accent)
color2  #81c784
color10 #a5d6a7

# yellow (warm)
color3  #fff176
color11 #fff59d

# blue (primary)
color4  #4fc3f7
color12 #81d4fa

# magenta (soft)
color5  #ce93d8
color13 #e1bee7

# cyan (frutiger aero core)
color6  #00bcd4
color14 #4dd0e1

# white
color7  #b2dfdb
color15 #e0f7fa
